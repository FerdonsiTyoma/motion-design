<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Ложь империи</title>
<style>
/*FONTS*/
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
canvas{display:block}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;padding:10px 14px;background:rgba(0,0,0,.8);color:#fff;font:14px system-ui,sans-serif;align-items:center}
#ui button{font:inherit;padding:4px 14px}
#ui input{flex:1}
html.render #ui{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="pb">▶ Play</button><input id="sc" type="range" min="0" max="10000" value="0"><span id="tc">0.0 s</span></div>
<script>
/* BEAT SHEET (120 BPM, beat = 0.5 s)
   0.0  intro   film leader 3-2-1 (beeps), title card "ЛОЖЬ ИМПЕРИИ" (piano chord)       projector clatter
   6.0  s1 1928 rubber hose B&W: Holodomor. dancing peasant + wheat -> train "В МОСКВУ" sucks grain;
                loudspeaker "Никакого голода нет!" 12.0, stamp 13.0, truth 13.7          ragtime -> minor piano
  16.0  s2 1930s two-strip: Molotov–Ribbentrop. handshake, secret protocol, scissors cut Poland;
                lie 22.0, stamp 23.0                                                      Dm swing, tuba+banjo
  26.0  s3 1940s Technicolor multiplane: Katyn. birch forest, caps, 1944 Soviet "report"   strings + harp
  36.0  s4 1950s UPA: Budapest 1956 / Prague 1968, tanks, "братская помощь"                cool jazz + bongos
  46.0  s5 1960s Hanna-Barbera: Cuba 1962, U-2 photo, diplomat lie                         comedic bassoon/xylo
  56.0  s6 1980s VHS: Chernobyl, cloud to Sweden, TV "Время"                               synthwave + geiger
  66.0  s7 cut-out (South Park-like): 2014 Crimea, "Нас тут нет!"                          acoustic guitar
  76.0  s8 cut-out: 2022, "Мы не собираемся нападать", calendar 24, tanks                  guitar -> silence/drone
  86.0  outro   all stamps fall, closing lines, "КОНЕЦ?" iris                              piano
   Every lie gets the same red "ЛОЖЬ" stamp (impact) — the thread through all eras. */

const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const RENDER = location.search.includes('render');
if (RENDER) document.documentElement.classList.add('render');
const SFX = /*SFX*/{};

// ---------- helpers ----------
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3), easeIn = x => Math.pow(clamp(x), 3);
const backOut = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(',')})`; };
const qbez = (a, c, b, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * c + t * t * b;

// drawing shorthands
function E(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); }
function C(x, y, r) { E(x, y, r, r); }
function RR(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function PL(p, close = true) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); if (close) ctx.closePath(); }
function F(c) { ctx.fillStyle = c; ctx.fill(); }
function S(c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function FS(f, s, w) { if (f) F(f); if (s) S(s, w); }
function LN(x1, y1, x2, y2, c, w) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); S(c, w); }
function T(s, x, y, font, fill, align = 'left', base = 'alphabetic') { ctx.font = font; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillStyle = fill; ctx.fillText(s, x, y); }
function fit(s, font, maxW) { ctx.font = font; const w = ctx.measureText(s).width; if (w <= maxW) return font; return font.replace(/(\d+)px/, (m, n) => Math.floor(n * maxW / w) + 'px'); }
function star(x, y, r, rot = -Math.PI / 2) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, rr = i % 2 ? r * .42 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }
function heart(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * .35); ctx.bezierCurveTo(x - s, y - s * .35, x - s * .45, y - s, x, y - s * .45); ctx.bezierCurveTo(x + s * .45, y - s, x + s, y - s * .35, x, y + s * .35); ctx.closePath(); }
const cnv = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };

// ---------- pre-rendered textures ----------
const GR = [0, 1, 2].map(i => cnv(960, 540, (g, w, h) => { const d = g.createImageData(w, h), r = rng(100 + i); for (let j = 0; j < d.data.length; j += 4) { const v = r() * 255; d.data[j] = d.data[j + 1] = d.data[j + 2] = v; d.data[j + 3] = 255; } g.putImageData(d, 0, 0); }));
const VIG = cnv(W, H, (g) => { const gr = g.createRadialGradient(W / 2, H / 2, H * .38, W / 2, H / 2, H * 1.05); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.9)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); });
const glow = (col) => cnv(512, 512, (g) => { const gr = g.createRadialGradient(256, 256, 0, 256, 256, 256); gr.addColorStop(0, col.replace('A', '1')); gr.addColorStop(.25, col.replace('A', '.55')); gr.addColorStop(1, col.replace('A', '0')); g.fillStyle = gr; g.fillRect(0, 0, 512, 512); });
const GLOW_SUN = glow('rgba(255,200,120,A)'), GLOW_HOT = glow('rgba(255,150,40,A)'), GLOW_RAD = glow('rgba(190,255,70,A)'), GLOW_CY = glow('rgba(80,240,255,A)');
const SCAN = cnv(4, 4, (g) => { g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0, 2, 4, 2); });
const speck = cnv(760, 320, (g) => { const r = rng(5); for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(0,0,0,${.3 + r() * .7})`; g.beginPath(); g.arc(r() * 760, r() * 320, r() * r() * 7 + .6, 0, TAU); g.fill(); } for (let i = 0; i < 40; i++) g.fillRect(r() * 760, r() * 320, r() * 80, r() * 3); });
const stampCv = document.createElement('canvas'); stampCv.width = 760; stampCv.height = 320;
function glowAt(img, x, y, size, a = 1) { ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(img, x - size / 2, y - size / 2, size, size); ctx.restore(); }

// ---------- timeline & scene config ----------
const TL = [['intro', 6], ['s1', 10], ['s2', 10], ['s3', 10], ['s4', 10], ['s5', 10], ['s6', 10], ['s7', 10], ['s8', 10], ['outro', 8]];
let acc = 0;
const SC = TL.map(([id, d]) => { const o = { id, d, t0: acc }; acc += d; return o; });
window.VIDEO = { w: W, h: H, duration: acc };
const T0 = id => SC.find(s => s.id === id).t0;

const CFG = {
  intro: { fps: 24 },
  s1: { fps: 12, cap: 'film', label: 'Стиль 1928 · «резиновый шланг», ч/б плёнка', year: '1932–1933',
    lines: ['Голодомор. Зерно отбирали у крестьян Украины —', 'от голода погибли миллионы человек.'],
    lie: 'Никакого голода нет!', truth: 'Голод официально отрицали до конца 1980-х.',
    tCap: 2.4, tLie: 6.0, tStamp: 7.0, tTruth: 7.7, bub: [1030, 235, 1440, 330], rot: -.16 },
  s2: { fps: 12, cap: 'two', label: 'Стиль 1930-х · двухцветный техниколор', year: '1939',
    lines: ['Пакт Молотова — Риббентропа. Секретный протокол', 'делил Восточную Европу между СССР и нацистами.'],
    lie: 'Никакого секретного\nпротокола нет!', truth: 'СССР признал протокол только в 1989 году.',
    tCap: 2.4, tLie: 6.2, tStamp: 7.1, tTruth: 7.8, bub: [1560, 200, 1600, 520], rot: .12 },
  s3: { fps: 24, cap: 'tech', label: 'Стиль 1940-х · мультиплан, техниколор', year: '1940',
    lines: ['Катынь. НКВД расстрелял около 22 000', 'польских офицеров и гражданских.'],
    lie: 'Это сделали немцы!', truth: 'Москва признала вину только в 1990 году — через 50 лет.',
    tCap: 2.2, tLie: 6.2, tStamp: 7.1, tTruth: 7.8, bub: [700, 250, 1090, 390], rot: -.2 },
  s4: { fps: 12, cap: 'upa', label: 'Стиль 1950-х · UPA, плоский модернизм', year: '1956\n1968',
    lines: ['Будапешт-1956, Прага-1968.', 'Восстания раздавлены советскими танками.'],
    lie: 'Это братская помощь!', truth: 'Только в Венгрии погибли около 2 500 человек.',
    tCap: 2.0, tLie: 6.2, tStamp: 7.1, tTruth: 7.8, bub: [930, 290, 610, 545], rot: .15 },
  s5: { fps: 8, cap: 'hb', label: 'Стиль 1960-х · ТВ-мультфильм, ограниченная анимация', year: '1962',
    lines: ['Карибский кризис. СССР тайно размещает', 'ядерные ракеты на Кубе.'],
    lie: 'Наше оружие на Кубе —\nтолько оборонительное!', truth: 'Снимки U-2 показали ракеты. Мир — на грани ядерной войны.',
    tCap: 2.0, tLie: 6.0, tStamp: 7.0, tTruth: 7.7, bub: [880, 225, 420, 410], rot: -.14 },
  s6: { fps: 12, cap: 'vhs', label: 'Стиль 1980-х · субботний мультфильм, VHS', year: '1986',
    lines: ['Чернобыль. 26 апреля взрывается реактор.', 'Власти больше двух суток молчат.'],
    lie: 'Поводов для\nбеспокойства нет!', truth: 'Мир узнал о беде от Швеции. 1 мая в Киеве — парад.',
    tCap: 2.6, tLie: 6.0, tStamp: 7.0, tTruth: 7.7, bub: [1130, 250, 1540, 400], rot: .14 },
  s7: { fps: 8, cap: 'sp', label: 'Стиль 1997+ · бумажная перекладка', year: '2014',
    lines: ['Аннексия Крыма, война на Донбассе.', 'Сбит рейс MH17 — 298 погибших.'],
    lie: 'Нас тут нет!', truth: 'Позже Путин признал: в Крыму действовали российские военные.',
    tCap: 3.0, tLie: 6.0, tStamp: 7.0, tTruth: 7.7, bub: [920, 395, 920, 500], rot: -.12 },
  s8: { fps: 8, cap: 'sp', label: 'Стиль 1997+ · бумажная перекладка', year: '2022',
    lines: ['24 февраля 2022 года. Полномасштабное', 'вторжение России в Украину.'],
    lie: 'Мы не собираемся\nни на кого нападать!', truth: 'Десятки тысяч погибших. Миллионы беженцев.',
    tCap: 3.6, tLie: .8, tStamp: 5.6, tTruth: 6.6, bub: [760, 250, 370, 420], rot: .1 },
  outro: { fps: 12 },
};
// transition into each scene
const TR = { s1: 'iris', s2: 'iris', s3: 'iris', s4: 'wipe', s5: 'wipe', s6: 'static', s7: 'static', s8: 'wipe', outro: 'iris' };
const WIPE_COLS = { s4: ['#2E8C8A', '#E2B33C', '#E8735A', '#1b1b1b'], s5: ['#FFD23F', '#d7263d', '#2b8fd6', '#111'], s8: ['#ffffff', '#f5cf2e', '#6fb7ea', '#111'] };
const TRD = .45;

// ---------- shared overlays ----------
const CAPS = {
  film: { bg: '#0b0b0b', bd: '#f2f2f2', yf: "700 76px 'Old Standard TT'", yc: '#fff', tf: "400 38px 'Old Standard TT'", tc: '#ececec', rc: '#ff5b4f', r: 0, dbl: true },
  two: { bg: '#ecdcb6', bd: '#2b211b', yf: '90px Lobster', yc: '#b5432c', tf: '500 34px Rubik', tc: '#2b211b', rc: '#b5432c', r: 6 },
  tech: { bg: '#18204a', bd: '#d9a441', yf: '92px Lobster', yc: '#f0c060', tf: '400 34px Rubik', tc: '#f4ead2', rc: '#ff8a66', r: 14, dbl: true },
  upa: { bg: '#E8735A', bd: null, yf: '84px Neucha', yc: '#1b1b1b', tf: '44px Neucha', tc: '#1b1b1b', rc: '#FFF6E2', r: 0, shadow: '#1b1b1b' },
  hb: { bg: '#FFD23F', bd: '#111', yf: '900 84px Rubik', yc: '#d7263d', tf: '700 35px Rubik', tc: '#111', rc: '#c41a30', r: 30, shadow: '#111', lw: 7 },
  vhs: { bg: 'rgba(12,6,34,.9)', bd: '#ff3df2', yf: "80px 'Russo One'", yc: '#4df3ff', tf: "31px 'Russo One'", tc: '#ece8ff', rc: '#ffd23f', r: 8, glow: true },
  sp: { bg: '#fff', bd: '#111', yf: '90px Pangolin', yc: '#111', tf: '40px Pangolin', tc: '#111', rc: '#d62828', r: 4, rot: -.008 },
};
function caption(c, u) {
  const s = CAPS[c.cap], p = u - c.tCap; if (p < 0) return;
  const y = 790 + (1 - spring(p, 13, .75)) * 330, x0 = 80, w = 1760, h = 250;
  ctx.save();
  if (s.rot) { ctx.translate(960, 915); ctx.rotate(s.rot); ctx.translate(-960, -915); }
  if (s.shadow) { RR(x0 + 14, y + 14, w, h, s.r); F(s.shadow); }
  RR(x0, y, w, h, s.r); F(s.bg);
  if (s.bd) {
    if (s.glow) { ctx.shadowColor = s.bd; ctx.shadowBlur = 22; }
    RR(x0, y, w, h, s.r); S(s.bd, s.lw || 4); ctx.shadowBlur = 0;
    if (s.dbl) { RR(x0 + 12, y + 12, w - 24, h - 24, Math.max(0, s.r - 8)); S(s.bd, 1.5); }
  }
  ctx.globalAlpha = clamp(p * 4);
  const yl = c.year.split('\n');
  if (yl.length > 1) yl.forEach((l, i) => T(l, x0 + 230, y + 112 + i * 84, s.yf, s.yc, 'center'));
  else T(c.year, x0 + 230, y + 152, fit(c.year, s.yf, 400), s.yc, 'center');
  LN(x0 + 465, y + 40, x0 + 465, y + h - 40, s.tc, 2);
  c.lines.forEach((L, i) => { ctx.globalAlpha = clamp((p - .15 - i * .12) * 5); T(L, x0 + 510, y + 80 + i * 56, fit(L, s.tf, 1200), s.tc); });
  const pt = u - c.tTruth;
  if (pt > 0) { ctx.globalAlpha = clamp(pt * 4); const L = '→ ' + c.truth; T(L, x0 + 510 + (1 - easeOut(pt * 3)) * 40, y + 206, fit(L, s.tf, 1200), s.rc); }
  ctx.restore(); ctx.globalAlpha = 1;
}

const BUB = {
  film: { f: '#fff', s: '#111', lw: 6, font: "700 52px 'Old Standard TT'", c: '#111', pill: true },
  two: { f: '#f6ead0', s: '#2b211b', lw: 5, font: '700 44px Rubik', c: '#2b211b' },
  tech: { f: '#f3e3bf', s: '#6b4a1f', lw: 4, font: '60px Lobster', c: '#4a2f10' },
  upa: { f: '#FFF6E2', s: '#1b1b1b', lw: 3, font: '60px Neucha', c: '#1b1b1b', off: true, r: 0 },
  hb: { f: '#fff', s: '#111', lw: 7, font: '800 46px Rubik', c: '#111' },
  vhs: { f: '#0d0a26', s: '#4df3ff', lw: 4, font: "44px 'Russo One'", c: '#fff', glow: true },
  sp: { f: '#fff', s: '#111', lw: 4, font: '54px Pangolin', c: '#111' },
};
function bubble(c, u) {
  const s = BUB[c.cap], p = u - c.tLie; if (p < 0) return;
  const [cx, cy, tx, ty] = c.bub, k = backOut(p / .35), lines = c.lie.split('\n');
  ctx.font = s.font; const fs = parseInt(s.font.match(/(\d+)px/)[1]), lh = fs * 1.2;
  const tw = Math.max(...lines.map(l => ctx.measureText(l).width)), w = tw + 100, h = lines.length * lh + 64;
  const bx = cx - w / 2, by = cy - h / 2, r = s.pill ? h / 2 : (s.r ?? 36);
  const ang = Math.atan2(ty - cy, tx - cx), bw = Math.min(w, h) * .2, px = -Math.sin(ang) * bw, py = Math.cos(ang) * bw;
  const body = () => { ctx.beginPath(); ctx.roundRect(bx, by, w, h, r); };
  const tail = () => { ctx.beginPath(); ctx.moveTo(cx + px, cy + py); ctx.lineTo(tx, ty); ctx.lineTo(cx - px, cy - py); ctx.closePath(); };
  c._bb = [cx, cy, w, h];
  ctx.save(); ctx.globalAlpha = clamp(p * 6);
  ctx.translate(tx, ty); ctx.scale(k, k); ctx.translate(-tx, -ty);
  if (s.off) { body(); F(s.f); tail(); F(s.f); ctx.save(); ctx.translate(9, -7); body(); S(s.s, s.lw); tail(); S(s.s, s.lw); ctx.restore(); }
  else {
    if (s.glow) { ctx.shadowColor = s.s; ctx.shadowBlur = 20; }
    body(); S(s.s, s.lw * 2); tail(); S(s.s, s.lw * 2); ctx.shadowBlur = 0; body(); F(s.f); tail(); F(s.f);
  }
  lines.forEach((l, i) => T(l, cx, cy + (i - (lines.length - 1) / 2) * lh, s.font, s.c, 'center', 'middle'));
  ctx.restore();
}
function stamp(x, y, p, rot = -.18, sc = 1) {
  if (p < 0) return;
  const g = stampCv.getContext('2d'); g.clearRect(0, 0, 760, 320);
  g.globalCompositeOperation = 'source-over'; g.strokeStyle = g.fillStyle = '#d4231c';
  g.lineWidth = 14; g.beginPath(); g.roundRect(30, 30, 700, 260, 26); g.stroke();
  g.lineWidth = 5; g.beginPath(); g.roundRect(56, 56, 648, 208, 16); g.stroke();
  g.font = '900 172px Rubik'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('ЛОЖЬ', 380, 176);
  g.globalCompositeOperation = 'destination-out'; g.drawImage(speck, 0, 0); g.globalCompositeOperation = 'source-over';
  const k = lerp(2.6, 1, spring(p, 24, .55));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k * sc * .62, k * sc * .62); ctx.globalAlpha = clamp(p * 10) * .95; ctx.drawImage(stampCv, -380, -160); ctx.restore();
}
function shakeOf(u, times) { let x = 0, y = 0; for (const tm of times) { const p = u - tm; if (p > 0 && p < .5) { const a = 18 * Math.exp(-p * 12); x += a * Math.sin(p * 95); y += a * Math.cos(p * 77); } } return [x, y]; }
function eraLabel(c, u) {
  const a = clamp((u - .35) * 3) * (1 - clamp((u - 9.5) * 4)); if (a <= 0) return;
  const font = CAPS[c.cap].tf.replace(/\d+px/, '25px');
  ctx.font = font; const w = ctx.measureText(c.label).width + 40;
  ctx.save(); ctx.globalAlpha = a * .9; RR(34, 32, w, 48, 24); F('rgba(0,0,0,.55)'); T(c.label, 54, 57, font, '#fff', 'left', 'middle'); ctx.restore();
}
function film(t, { grain = .25, scratch = true, flick = .05, vig = 1, tint = null } = {}) {
  const f = Math.floor(t * 24), r = rng(f * 7919 + 3);
  if (tint) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = grain; ctx.drawImage(GR[f % 3], -r() * 60, -r() * 60, W + 120, H + 120); ctx.restore();
  if (scratch) {
    ctx.save(); const n = Math.floor(r() * 3);
